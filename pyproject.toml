[project]
name = "daybreak"
version = "0.2.0"
description = "Cut two periods of days into equal steps that land on the same clock times, in a different order."
authors = [{ name = "Matt" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://mattabate.com/projects"
Repository = "https://github.com/mattabate/daybreak"

[project.scripts]
daybreak = "daybreak.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = "--doctest-glob=README.md"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
